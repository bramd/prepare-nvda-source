name: Prepare NVDA source
description: Checkout and build a runnable NVDA source tree for add-on development (scons source)

inputs:
  python-version:
    description: >-
      Python version to install. Leave empty to auto-detect it from NVDA's .python-versions file
      (requires NVDA >= 2025.3). An explicit value overrides the auto-detected one.
    required: false
    default: ""
  python-arch:
    description: >-
      Python architecture (x86 or x64). Leave empty to auto-detect it from NVDA's .python-versions
      file (requires NVDA >= 2025.3). An explicit value overrides the auto-detected one.
    required: false
    default: ""
  nvda-ref:
    description: Git ref to checkout (tag or branch)
    required: true
  path:
    description: >-
      Directory to clone NVDA into. A relative value resolves against the workspace, an absolute
      value is used as-is. The default keeps NVDA in the workspace. Set `../nvda`, or an absolute
      path, to keep it out of a repository that is checked out at the workspace root.
    required: false
    default: "nvda"
  github-token:
    description: GitHub token for API access (used to resolve the NVDA ref to a commit SHA)
    required: true
  scons-args:
    description: Extra arguments appended to `scons source` (e.g. -j2, version=...)
    required: false
    default: "-j2"
  install-vs-components:
    description: >-
      Whether to add the components from NVDA's .vsconfig to the installed Visual Studio at
      runtime. The GitHub-hosted Windows images already ship what NVDA's build needs, so this
      defaults to false, matching nvaccess/nvda's own build. Set it to true on a runner whose
      Visual Studio is missing components NVDA declares.
    required: false
    default: "false"
  vs-version:
    description: >-
      Major Visual Studio version to select when installing components (e.g. 17 for VS 2022, 18
      for VS 2026). Leave empty to use the latest installed VS. Only used when
      install-vs-components is true.
    required: false
    default: ""

outputs:
  nvda-path:
    description: Absolute path to the built NVDA source tree, with forward slashes
    value: ${{ steps.resolve-path.outputs.dir }}
  cache-hit:
    description: Whether the NVDA cache was hit
    value: ${{ steps.cache-nvda.outputs.cache-hit }}

runs:
  using: composite
  steps:
    - name: Resolve NVDA path
      id: resolve-path
      shell: pwsh
      env:
        INPUT_PATH: ${{ inputs.path }}
      run: |
        $ErrorActionPreference = 'Stop'
        # A caller that sets `path:` to an empty value gets that empty string, not this
        # action's `default:`.
        $requested = $env:INPUT_PATH
        if ([string]::IsNullOrWhiteSpace($requested)) { $requested = 'nvda' }
        $workspace = [System.IO.Path]::GetFullPath($env:GITHUB_WORKSPACE)
        # Combine() returns an already-rooted second argument unchanged, which gives absolute-wins /
        # relative-resolves-against-the-workspace; GetFullPath then normalises away any '..'.
        $abs = [System.IO.Path]::GetFullPath([System.IO.Path]::Combine($workspace, $requested)).TrimEnd('\')
        "dir=$($abs.Replace('\', '/'))" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        "win=$abs" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
        Write-Host "NVDA path: $abs"

    - name: Get NVDA commit SHA
      id: get-sha
      shell: bash
      run: |
        SHA=$(gh api repos/nvaccess/nvda/commits/${{ inputs.nvda-ref }} --jq '.sha')
        echo "sha=$SHA" >> $GITHUB_OUTPUT
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    # If python-version/python-arch aren't given, read them from NVDA's root .python-versions file
    # (present since NVDA 2025.3). Each line is `cpython-<X.Y.Z>-windows-<arch>-none`; we take the
    # first line as the primary interpreter and map x86_64->x64. NVDA's uv is
    # python-preference=only-system, so pinning the exact patch NVDA declares is what makes the
    # build find its interpreter. An explicit input always wins.
    - name: Resolve Python version and arch
      id: resolve-python
      shell: bash
      run: |
        VERSION='${{ inputs.python-version }}'
        ARCH='${{ inputs.python-arch }}'
        if [ -z "$VERSION" ] || [ -z "$ARCH" ]; then
          CONTENT=$(gh api "repos/nvaccess/nvda/contents/.python-versions?ref=${{ steps.get-sha.outputs.sha }}" -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          LINE=$(echo "$CONTENT" | grep -m1 -oE 'cpython-[0-9]+\.[0-9]+\.[0-9]+-windows-(x86_64|x86)-none' || true)
          if [ -z "$LINE" ]; then
            echo "::error::Could not auto-detect Python from nvaccess/nvda@${{ inputs.nvda-ref }} (.python-versions is missing before NVDA 2025.3 or unparseable). Pass python-version and python-arch explicitly."
            exit 1
          fi
          DETECTED_VERSION=$(echo "$LINE" | sed -E 's/^cpython-([0-9.]+)-.*/\1/')
          DETECTED_ARCH_TOKEN=$(echo "$LINE" | sed -E 's/.*-windows-([a-z0-9_]+)-none/\1/')
          if [ "$DETECTED_ARCH_TOKEN" = "x86_64" ]; then DETECTED_ARCH=x64; else DETECTED_ARCH=x86; fi
          [ -z "$VERSION" ] && VERSION="$DETECTED_VERSION"
          [ -z "$ARCH" ] && ARCH="$DETECTED_ARCH"
        fi
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "arch=$ARCH" >> $GITHUB_OUTPUT
        echo "Resolved python-version=$VERSION python-arch=$ARCH"
      env:
        GH_TOKEN: ${{ inputs.github-token }}

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.resolve-python.outputs.version }}
        architecture: ${{ steps.resolve-python.outputs.arch }}

    # NVDA's x64 builds contain 32-bit components, so a matching 32-bit interpreter is required to
    # build them. x86 builds already have a 32-bit primary interpreter, so this is skipped there.
    - name: Set up Python (32 bit)
      if: steps.resolve-python.outputs.arch == 'x64'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ steps.resolve-python.outputs.version }}
        architecture: x86
        update-environment: false

    - name: Cache NVDA
      id: cache-nvda
      uses: actions/cache@v5
      with:
        path: ${{ steps.resolve-path.outputs.dir }}
        key: ${{ runner.os }}-nvda-${{ steps.resolve-python.outputs.version }}-${{ steps.resolve-python.outputs.arch }}-${{ steps.get-sha.outputs.sha }}

    - name: Clone NVDA
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      shell: bash
      env:
        NVDA_DIR: ${{ steps.resolve-path.outputs.dir }}
        NVDA_SHA: ${{ steps.get-sha.outputs.sha }}
      run: |
        git clone --depth 1 --revision "$NVDA_SHA" \
          --recurse-submodules --shallow-submodules \
          https://github.com/nvaccess/nvda "$NVDA_DIR"

    # Installed after NVDA is available (from the clone or the restored cache) so setup-uv can key
    # its cache on NVDA's lockfile. uv is only needed for `scons source`, which runs after this.
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: ${{ steps.resolve-path.outputs.dir }}/uv.lock

    - name: Install Visual Studio components
      if: steps.cache-nvda.outputs.cache-hit != 'true' && inputs.install-vs-components == 'true'
      shell: pwsh
      env:
        NVDA_DIR_WIN: ${{ steps.resolve-path.outputs.win }}
      run: |
        $installerDir = Join-Path ${env:ProgramFiles(x86)} "Microsoft Visual Studio\Installer"
        # Locate the VS install with vswhere instead of hardcoding an edition/path, so this works
        # across Community/Enterprise/BuildTools and different VS versions.
        $vswhere = Join-Path $installerDir "vswhere.exe"
        $vsArgs = @('-latest', '-products', '*', '-property', 'installationPath')
        $vsVersion = '${{ inputs.vs-version }}'
        if ($vsVersion) {
          $next = [int]$vsVersion + 1
          $vsArgs += @('-version', "[$vsVersion.0,$next.0)")
        }
        $InstallPath = (& $vswhere @vsArgs | Select-Object -First 1)
        if (-not $InstallPath) {
          throw "No Visual Studio installation found (vswhere returned nothing for version '$vsVersion')."
        }
        Write-Host "Using Visual Studio at: $InstallPath"
        $ConfigPath = Join-Path ${env:NVDA_DIR_WIN} ".vsconfig"
        $vsInstaller = Join-Path $installerDir "vs_installer.exe"
        $Arguments = @('modify', '--installPath', $InstallPath, '--config', $ConfigPath, '--quiet', '--norestart', '--nocache', '--includeRecommended')
        # Run twice: the first pass may only self-update the installer without applying the config.
        foreach ($attempt in 1..2) {
          Start-Process -FilePath $vsInstaller -ArgumentList $Arguments -Wait -WindowStyle Hidden
        }

    # ImageVersion is a runner-set env var and isn't available in the `env` expression context, so
    # build the key in a shell step (mirrors nvaccess/nvda). The .vsconfig hash keeps the cache
    # correct when the installed VS components differ between NVDA versions.
    - name: Compute SCons MSVC cache key
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      shell: bash
      env:
        NVDA_DIR: ${{ steps.resolve-path.outputs.dir }}
      run: |
        VSCONFIG_HASH=none
        if [ -f "$NVDA_DIR/.vsconfig" ]; then
          VSCONFIG_HASH=$(sha256sum "$NVDA_DIR/.vsconfig" | cut -d' ' -f1)
        fi
        echo "SCONS_MSVC_CACHE_KEY=${RUNNER_OS}-scons-msvc-${ImageVersion}-${{ inputs.vs-version }}-${VSCONFIG_HASH}" >> $GITHUB_ENV

    - name: Cache SCons MSVC config
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      uses: actions/cache@v5
      with:
        path: ${{ runner.temp }}/scons_msvc_cache.json
        key: ${{ env.SCONS_MSVC_CACHE_KEY }}

    - name: Prepare NVDA's source tree
      if: steps.cache-nvda.outputs.cache-hit != 'true'
      shell: cmd
      working-directory: ${{ steps.resolve-path.outputs.dir }}
      env:
        SCONS_CACHE_MSVC_CONFIG: ${{ runner.temp }}/scons_msvc_cache.json
        VSCMD_SKIP_SENDTELEMETRY: "1"
      run: scons source ${{ inputs.scons-args }}
